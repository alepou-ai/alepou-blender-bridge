[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alepou-blender-bridge"
version = "0.4.0"
description = "Local, inspectable Blender bridge for Alepou-managed AI sessions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
license = { text = "Apache-2.0" }
authors = [{ name = "Alepou", email = "hello@alepou.ai" }]
keywords = ["alepou", "blender", "ai", "bridge"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
alepou-blender = "alepou_blender.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
